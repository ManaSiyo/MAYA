<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya · One-pager preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#1a1d28; display:flex; flex-direction:column; align-items:center; gap:28px; padding:40px 0; font-family:'Jost',sans-serif; }
  .label { color:rgba(245,250,255,0.6); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; }
  .page-shadow { box-shadow:0 20px 80px rgba(0,0,0,0.6); border-radius:4px; overflow:hidden; }
  /* scale the A4 page (794px) down a touch so both fit on screen; remove to see 1:1 */
</style>
</head>
<body>
  <div class="label">Page 1 — Client-facing</div>
  <div class="page-shadow" id="page1"></div>
  <div class="label">Page 2 — Production / sourcing</div>
  <div class="page-shadow" id="page2"></div>

<script>
const escapeHtml = s => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- SAMPLE DATA (stand-in for a real consultation) ----
const name = 'Naveed';
const today = 'May 30, 2026';
const occasion = 'Winter gala — black tie, modern';
const personPara = 'Naveed moves between boardrooms and gallery openings and wants one piece that carries both. Drawn to sharp tailoring softened by an unexpected drape, with a quiet confidence rather than loud flash.';
const visionPara = 'A floor-skimming tailored coat-dress in deep oxblood, structured shoulder easing into a fluid hem. Architectural up top, liquid below — couture restraint with a single dramatic gesture.';
const heroImg = '';   // leave blank → shows placeholder
const silhouette = ['floor-length','structured shoulder','column'];
const details = ['exposed seams','asymmetric closure','high collar'];
const colors = ['oxblood','charcoal'];
const inhouseFabrics = [
  { name:'Italian wool crepe', color:'charcoal', weave:'crepe', weight:'mid' },
  { name:'Silk duchesse', color:'oxblood', weave:'satin', weight:'heavy' },
];
const toSource = ['Silk organza','Metallic lurex thread'];
const designerNotes = ['Reference McQueen A/W structured drape','Boning through bodice only'];

function chipBlock(label, list){ return list&&list.length?`
  <div style="flex:1;min-width:0">
    <div style="font-family:'Jost',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.55);margin-bottom:6px">${escapeHtml(label)}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${list.map(t=>`<span style="background:transparent;border:0.5px solid rgba(255,255,255,0.22);border-radius:100px;padding:3px 12px;font-family:'Jost',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.85);line-height:1.4">${escapeHtml(t)}</span>`).join('')}
    </div>
  </div>`:''; }

const measurementsHtml = `
  <div style="display:flex;gap:24px;justify-content:center;font-family:'Cormorant Garamond',serif">
    <div style="flex:1;max-width:240px">
      <div style="font-family:'Jost',sans-serif;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(200,220,255,0.55);text-align:center;margin-bottom:6px">X-axis</div>
      ${[['Bust / Chest','40"'],['Waist','33"'],['Hip','41"'],['Shoulder','18"']].map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(245,250,255,0.85);padding:2px 0"><span style="font-style:italic">${k}</span><span>${v}</span></div>`).join('')}
    </div>
    <div style="flex:1;max-width:240px">
      <div style="font-family:'Jost',sans-serif;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(200,220,255,0.55);text-align:center;margin-bottom:6px">Y-axis</div>
      ${[['Height','71"'],['Neck to waist','17"'],['Inseam','33"'],['Hip to ankle','42"']].map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(245,250,255,0.85);padding:2px 0"><span style="font-style:italic">${k}</span><span>${v}</span></div>`).join('')}
    </div>
  </div>`;

document.getElementById('page1').innerHTML = `
<div style="width:794px;height:1123px;background:radial-gradient(ellipse at 30% 20%,rgba(60,80,120,0.20) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(40,60,100,0.18) 0%,transparent 55%),#070a14;color:rgba(245,250,255,0.92);font-family:'Jost',sans-serif;font-weight:300;position:relative;overflow:hidden;padding:42px 80px 44px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:0.5px solid rgba(255,255,255,0.22);padding-bottom:10px;margin-bottom:18px">
    <div style="font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.85)">Mana Siyo</div>
    <div style="font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.85)">${today}</div>
  </div>
  <div style="text-align:center;margin:6px 0 16px">
    <div style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:56px;letter-spacing:0.22em;color:#fff;text-shadow:0 0 32px rgba(180,210,255,0.55),0 0 64px rgba(180,210,255,0.28);line-height:1">MAYA</div>
  </div>
  <div style="text-align:center;margin:0 0 14px">
    <span style="display:inline-block;padding:8px 22px;border-radius:100px;border:0.5px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.04);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;letter-spacing:0.04em;color:rgba(245,250,255,0.95)">${name}</span>
  </div>
  <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:rgba(245,250,255,0.65);text-align:center;margin-bottom:14px">${occasion}</div>
  <div style="text-align:center;margin:0 0 14px">
    <div style="font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.55);margin-bottom:6px">Biography</div>
    <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;line-height:1.55;color:rgba(245,250,255,0.85);margin:0 20px">${personPara}</p>
  </div>
  <div style="text-align:center;margin-bottom:16px">
    <div style="font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.55);margin-bottom:6px">Vision</div>
    <p style="font-family:'Cormorant Garamond',serif;font-size:13px;line-height:1.55;color:rgba(245,250,255,0.85);margin:0 20px">${visionPara}</p>
  </div>
  ${heroImg?`<div style="text-align:center;margin:0 auto 12px;padding:8px;border-radius:12px;border:0.5px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.02)"><img src="${heroImg}" style="display:block;width:100%;max-height:340px;object-fit:contain;border-radius:6px"/></div>`
    :`<div style="text-align:center;margin:0 auto 16px;height:300px;border-radius:12px;border:0.5px dashed rgba(255,255,255,0.22);background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(245,250,255,0.4)">[ dream garment render ]</div>`}
  <div style="text-align:center;margin:6px 0 10px">
    <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:rgba(245,250,255,0.65);margin-bottom:6px">Inspired by</div>
    <div style="display:flex;gap:10px;justify-content:center">
      ${[1,2,3].map(()=>`<div style="width:120px;height:160px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;color:rgba(245,250,255,0.3);font-size:10px">inspo</div>`).join('')}
    </div>
  </div>
  <div style="margin-top:auto">
    <div style="font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.55);text-align:center;margin-bottom:8px">Measurements</div>
    ${measurementsHtml}
  </div>
</div>`;

const SECTION_HEAD = `font-family:'Jost',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.55);border-bottom:0.5px solid rgba(255,255,255,0.18);padding-bottom:6px;margin-bottom:8px`;
const ROW_BORDER = `border-bottom:0.25px solid rgba(255,255,255,0.12)`;
const ROW_TEXT = `font-family:'Cormorant Garamond',serif;font-size:12px;color:rgba(245,250,255,0.85);line-height:1.3`;
const META = `font-family:'Jost',sans-serif;font-weight:300;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.55)`;
const LINK = `font-family:'Jost',sans-serif;font-weight:300;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.85);text-decoration:none`;

document.getElementById('page2').innerHTML = `
<div style="width:794px;height:1123px;background:radial-gradient(ellipse at 30% 20%,rgba(60,80,120,0.20) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(40,60,100,0.18) 0%,transparent 55%),#070a14;color:rgba(245,250,255,0.92);font-family:'Jost',sans-serif;font-weight:300;position:relative;overflow:hidden;padding:50px 60px 70px;box-sizing:border-box">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:0.5px solid rgba(255,255,255,0.22);padding-bottom:14px;margin-bottom:22px">
    <div style="font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.85)">${name} &middot; Resources</div>
    <div style="font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.85)">How to make</div>
  </div>
  <div style="margin-bottom:22px">
    <div style="${SECTION_HEAD}">From your atelier</div>
    ${inhouseFabrics.map(f=>`<div style="display:flex;align-items:center;gap:14px;padding:8px 0;${ROW_BORDER}">
      <div style="width:42px;height:42px;border-radius:6px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.22)"></div>
      <div style="flex:1"><div style="${ROW_TEXT}">${f.name}</div><div style="${META};margin-top:4px">${f.color} &middot; ${f.weave} &middot; ${f.weight}</div></div>
      <div style="${META}">In atelier</div>
    </div>`).join('')}
  </div>
  <div style="margin-bottom:22px">
    <div style="${SECTION_HEAD}">To source</div>
    ${toSource.map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;${ROW_BORDER}">
      <div style="${ROW_TEXT}">${t}</div>
      <div style="display:flex;gap:16px"><a href="#" style="${LINK}">Etsy &rarr;</a><a href="#" style="${LINK}">Amazon &rarr;</a></div>
    </div>`).join('')}
  </div>
  <div style="margin-bottom:22px">
    <div style="${SECTION_HEAD}">CLO references</div>
    ${designerNotes.map(n=>`<div style="${ROW_TEXT};padding:6px 0;${ROW_BORDER}">${n}</div>`).join('')}
  </div>
  <div style="margin-bottom:22px">
    <div style="${SECTION_HEAD}">Listen to the consultation</div>
    <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:rgba(245,250,255,0.65);padding:6px 0">Audio clips live alongside this PDF in the consultation folder.</div>
  </div>
  <div style="position:absolute;bottom:30px;left:60px;right:60px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,250,255,0.45)">
    <div>Mana Siyo &middot; Atelier &middot; Bespoke</div><div>Generated by Maya</div>
  </div>
</div>`;
</script>
</body>
</html>
